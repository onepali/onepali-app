name: Build releases

on:
  workflow_dispatch:
  push:
    tags:
      - '**'

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY_JKS_BASE64 }}" | base64 --decode > android/app/onepali.jks

      - name: Remove old key.properties
        run: rm -f android/key.properties

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > $GITHUB_WORKSPACE/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_WORKSPACE/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> $GITHUB_WORKSPACE/android/key.properties
          echo "storeFile=onepali.jks" >> $GITHUB_WORKSPACE/android/key.properties

      - name: Debug workspace root
        run: ls -l

      - name: Debug key.properties
        run: |
          ls -l android/
          cat android/key.properties

      - name: Create .env file if missing
        run: |
          if [ ! -f .env ]; then
            echo "# Empty .env file created by CI" > .env
          fi

      - name: Build
        run: flutter build apk --split-per-abi --no-tree-shake-icons

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [android]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          if [ -f ./scripts/generate-changelog.sh ]; then
            chmod +x ./scripts/generate-changelog.sh
            ./scripts/generate-changelog.sh | tee changelog.md
          else
            # Fallback changelog if script doesn't exist
            echo "# Release Notes" > changelog.md
            echo "" >> changelog.md
            echo "**Build Date:** $(date)" >> changelog.md
            echo "" >> changelog.md
            echo "## Recent Changes" >> changelog.md
            git log --oneline -10 --pretty=format:"- %s" >> changelog.md
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Rename artifacts
        run: |
           mv android/app-arm64-v8a-release.apk android/onepali.arm64-v8a.apk
           mv android/app-armeabi-v7a-release.apk android/onepali.armeabi-v7a.apk
           mv android/app-x86_64-release.apk android/onepali.x86_64.apk

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Generate unique tag and title
          TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
          TAG_NAME="release-${TIMESTAMP}"
          TITLE="Release ${TIMESTAMP}"
          
          # If triggered by workflow_dispatch, use a more descriptive title
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TITLE="Manual Release ${TIMESTAMP}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
            TITLE="Release ${{ github.ref_name }}"
          fi
          
          gh release create "${TAG_NAME}" \
            --title "${TITLE}" \
            -F changelog.md \
            android/onepali.arm64-v8a.apk \
            android/onepali.armeabi-v7a.apk \
            android/onepali.x86_64.apk
