name: Build releases

on:
  workflow_dispatch:
  push:
    tags:
      - '**'

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY_JKS_BASE64 }}" | base64 --decode > android/app/onepali.jks

      - name: Remove old key.properties
        run: rm -f android/key.properties

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > $GITHUB_WORKSPACE/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_WORKSPACE/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> $GITHUB_WORKSPACE/android/key.properties
          echo "storeFile=onepali.jks" >> $GITHUB_WORKSPACE/android/key.properties

      - name: Debug workspace root
        run: ls -l

      - name: Debug key.properties
        run: |
          ls -l android/
          cat android/key.properties

      - name: Create .env file if missing
        run: |
          if [ ! -f .env ]; then
            echo "# Empty .env file created by CI" > .env
          fi

      - name: Build
        run: flutter build apk --split-per-abi --no-tree-shake-icons

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [android]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          if [ -f ./scripts/generate-changelog.sh ]; then
            chmod +x ./scripts/generate-changelog.sh
            ./scripts/generate-changelog.sh | tee changelog.md
          else
            # Fallback changelog if script doesn't exist
            echo "# Release Notes" > changelog.md
            echo "" >> changelog.md
            echo "**Build Date:** $(date)" >> changelog.md
            echo "" >> changelog.md
            echo "## Recent Changes" >> changelog.md
            git log --oneline -10 --pretty=format:"- %s" >> changelog.md
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Debug GitHub context
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref name: ${{ github.ref_name }}"
          echo "Ref type: ${{ github.ref_type }}"
          echo "SHA: ${{ github.sha }}"
          echo "Repository: ${{ github.repository }}"

      - name: Rename artifacts
        run: |
           DATE_FORMAT=$(date +"%d %B, %Y")
           mv android/app-arm64-v8a-release.apk "android/O Nepali ($DATE_FORMAT).arm64-v8a.apk"
           mv android/app-armeabi-v7a-release.apk "android/O Nepali ($DATE_FORMAT).armeabi-v7a.apk"
           mv android/app-x86_64-release.apk "android/O Nepali ($DATE_FORMAT).x86_64.apk"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Generate unique tag and title based on trigger type
          TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
          
          # Default to timestamp-based tag to avoid conflicts
          TAG_NAME="release-${TIMESTAMP}"
          TITLE="Release ${TIMESTAMP}"
          
          # Check if this was triggered by a tag push
          if [[ "${{ github.event_name }}" == "push" ]] && [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Use the actual tag name only if it's a tag push
            TAG_NAME="${{ github.ref_name }}"
            TITLE="Release ${{ github.ref_name }}"
            echo "Creating release for tag: ${TAG_NAME}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger - use descriptive title
            TITLE="Manual Release ${TIMESTAMP}"
            echo "Creating manual release with tag: ${TAG_NAME}"
          else
            # Fallback for any other trigger (like push to main)
            TAG_NAME="auto-release-${TIMESTAMP}"
            TITLE="Automated Release ${TIMESTAMP}"
            echo "Creating automated release with tag: ${TAG_NAME}"
          fi
          
          # Check if tag already exists and modify if needed
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists, appending random suffix"
            RANDOM_SUFFIX=$(openssl rand -hex 4)
            TAG_NAME="${TAG_NAME}-${RANDOM_SUFFIX}"
            TITLE="${TITLE} (${RANDOM_SUFFIX})"
          fi
          
          echo "Final tag name: ${TAG_NAME}"
          echo "Final title: ${TITLE}"
          
          DATE_FORMAT=$(date +"%d %B, %Y")
          gh release create "${TAG_NAME}" \
            --title "${TITLE}" \
            --notes-file changelog.md \
            "android/O Nepali ($DATE_FORMAT).arm64-v8a.apk" \
            "android/O Nepali ($DATE_FORMAT).armeabi-v7a.apk" \
            "android/O Nepali ($DATE_FORMAT).x86_64.apk"
