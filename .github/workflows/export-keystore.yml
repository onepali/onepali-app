name: Export Keystore (Temporary)

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  export-keystore:
    name: Export Keystore
    runs-on: ubuntu-latest
    steps:
      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_JKS_BASE64 }}" | base64 --decode > onepali.jks
          
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> key.properties
          echo "storeFile=onepali.jks" >> key.properties
          
      - name: Verify keystore
        run: |
          echo "Keystore file created"
          ls -lh onepali.jks
          file onepali.jks
          
      - name: Upload keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore
          path: |
            onepali.jks
            key.properties
          retention-days: 1  # Auto-delete after 1 day for security

