name: onepali
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  provider: ^6.1.5
  photo_view: ^0.15.0
  dio: ^5.8.0+1
  share_plus: ^11.0.0
  connectivity_plus: ^6.1.4
  google_sign_in: ^6.3.0
  http_parser: ^4.1.2
  flutter_svg: ^2.1.0
  url_launcher: ^6.3.1
  audioplayers: ^6.4.0
  cached_network_image: ^3.4.1
  lottie: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/audio/
    - assets/fonts/
    - assets/json/
    - assets/lottie/
    - assets/images/
    - assets/svg/icons/
    - .env

  # fonts:
