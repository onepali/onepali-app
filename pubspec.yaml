name: onepali
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  provider: ^6.1.5
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.8
  google_sign_in: ^7.0.0
  flutter_facebook_auth: ^7.1.2
  flutter_svg: ^2.1.0
  intl: ^0.20.2
  modal_bottom_sheet: ^3.0.0
  pin_code_fields: ^8.0.1
  audioplayers: ^6.4.0
  cached_network_image: ^3.4.1
  lottie: ^3.3.1
  http: ^1.4.0
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.13.1
  shared_preferences: ^2.5.3
  fluttertoast: ^8.2.12
  firebase_storage: ^12.4.6
  youtube_player_flutter: ^9.1.1
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_cache_manager: ^3.4.1
  firebase_messaging: ^15.2.7
  flutter_local_notifications: ^19.3.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/brand/
    - assets/audio/
    - assets/audio/animals/
    - assets/fonts/
    - assets/json/
    - assets/lottie/
    - assets/lottie/animals/
    - assets/images/
    - assets/images/remark/
    - assets/images/animals/
    - assets/images/subcategories/
    - assets/images/avatar/
    - assets/svg/icons/
    - assets/svg/
    - assets/svg/parent/
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
        - asset: assets/fonts/Poppins-MediumItalic.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
    - family: Mukta
      fonts:
        - asset: assets/fonts/Mukta-Regular.ttf
        - asset: assets/fonts/Mukta-Medium.ttf
        - asset: assets/fonts/Mukta-SemiBold.ttf
        - asset: assets/fonts/Mukta-Bold.ttf
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
