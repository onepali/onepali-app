name: onepali
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.1.0+50

environment:
  sdk: ^3.8.1

# versions available, run `flutter pub outdated`.
dependencies:

  # Core Flutter SDKs
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  flutter_svg: ^2.3.0
  lottie: ^3.3.3
  flutter_animate: ^4.5.2
  google_fonts: ^8.0.2
  xml: ^6.6.1
  dotted_border: ^3.1.0

  # State Management
  provider: ^6.1.5
  flutter_bloc: ^9.1.1
  rxdart: ^0.28.0

  # Firebase Services
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_app_check: ^0.4.3
  firebase_storage: ^13.0.3
  firebase_messaging: ^16.5.0

  # Authentication
  google_sign_in: ^7.1.0
  sign_in_with_apple: ^8.0.0

  # Media & Content
  audioplayers: ^6.6.0
  video_player: ^2.11.1
  youtube_player_flutter: ^9.1.3
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.2
  path_drawing: ^1.0.1
  record: ^6.2.0
  flutter_flip_card: ^0.0.6

  # Networking & HTTP
  http: ^1.6.0
  connectivity_plus: ^7.3.1

  # Storage & File System
  shared_preferences: ^2.5.5
  permission_handler: ^12.0.3
  path_provider: ^2.1.4
  file_picker: ^11.0.2

  # Notifications & Device Features
  flutter_local_notifications: ^21.0.0
  fluttertoast: ^9.1.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0

  # Utils & Platform Integration
  intl: ^0.20.2
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.1
  share_plus: ^12.0.2
  in_app_review: ^2.0.12
  app_settings: ^7.0.0
  responsive_builder: ^0.7.1
  crypto: ^3.0.7

  # Code Generation & JSON Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  freezed: ^3.2.4
  build_runner: ^2.10.5
  json_serializable: ^6.11.4
  fake_cloud_firestore: ^4.2.0

flutter:
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/brand/
    - assets/audio/
    - assets/audio/sfx/
    - assets/audio/sounds/
    - assets/fonts/
    - assets/json/
    - assets/lottie/
    - assets/images/
    - assets/images/remark/
    - assets/images/avatar/
    - assets/svg/icons/
    - assets/svg/buttons/
    - assets/svg/
    - assets/svg/parent/
    # - .env
    - shorebird.yaml

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
        - asset: assets/fonts/Poppins-MediumItalic.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
    - family: Mukta
      fonts:
        - asset: assets/fonts/Mukta-Regular.ttf
        - asset: assets/fonts/Mukta-Medium.ttf
        - asset: assets/fonts/Mukta-SemiBold.ttf
        - asset: assets/fonts/Mukta-Bold.ttf
    - family: Luckiest Guy
      fonts:
        - asset: assets/fonts/LuckiestGuy-Regular.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
        - asset: assets/fonts/DMSans-SemiBold.ttf
        - asset: assets/fonts/DMSans-Bold.ttf
